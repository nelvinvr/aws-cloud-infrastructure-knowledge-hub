<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EC2 Hello World Web Server Lab Architecture</title>
  <desc id="desc">An internet user sends an HTTP request through an Internet Gateway and security group to an Amazon EC2 instance running Apache. The instance uses an eight GiB EBS root volume. EC2 Instance Connect provides temporary SSH administration.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172B4D" flood-opacity="0.14"/></filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1473E6"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#7B4AB5" stroke-width="2"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172B4D}.title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#5E6C84}.boundary-label{font-size:16px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#5E6C84}.tiny{font-size:12px}.center{text-anchor:middle}.blue{fill:#1473E6}.green{fill:#2E8540}.purple{fill:#7B4AB5}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="55" y="58" class="title">EC2 Hello World Web Server – Lab Architecture</text>
  <text x="57" y="88" class="subtitle">Workshop 1 • Amazon Linux 2023 • Apache HTTP Server</text>

  <rect x="320" y="120" width="1225" height="700" rx="18" fill="#F7F9FC" stroke="#5E6C84" stroke-width="2"/>
  <rect x="320" y="120" width="1225" height="42" rx="18" fill="#E8EDF3"/>
  <text x="345" y="148" class="boundary-label">AWS Cloud</text>

  <rect x="355" y="180" width="1155" height="585" rx="16" fill="#F2F7FD" stroke="#1473E6" stroke-width="2"/>
  <rect x="355" y="180" width="1155" height="38" rx="16" fill="#E1EFFD"/>
  <text x="380" y="205" class="boundary-label">Region: US East (N. Virginia)</text>

  <rect x="395" y="238" width="1075" height="445" rx="15" fill="#F7FCF8" stroke="#2E8540" stroke-width="2"/>
  <rect x="395" y="238" width="1075" height="38" rx="15" fill="#E7F5EA"/>
  <text x="420" y="264" class="boundary-label">Virtual Private Cloud (VPC)</text>

  <rect x="700" y="295" width="730" height="335" rx="14" fill="#FFFFFF" stroke="#29A3A3" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="700" y="295" width="730" height="38" rx="14" fill="#EAF8F8"/>
  <text x="725" y="320" class="boundary-label">Public subnet • Availability Zone us-east-1b</text>

  <rect x="55" y="350" width="215" height="135" rx="18" fill="#FFFFFF" stroke="#172B4D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="112" y="370" width="100" height="54" rx="6" fill="#E8EDF3" stroke="#172B4D" stroke-width="2"/>
  <rect x="120" y="378" width="84" height="35" fill="#FFFFFF"/>
  <path d="M145 435h34l12 12h-58z" fill="#5E6C84"/>
  <text x="162" y="462" class="heading center">Internet user</text>
  <text x="162" y="481" class="body center">Web browser</text>

  <polygon points="455,380 605,380 640,430 605,480 455,480 420,430" fill="#E8F1FB" stroke="#1473E6" stroke-width="2"/>
  <circle cx="530" cy="420" r="19" fill="none" stroke="#1473E6" stroke-width="3"/>
  <path d="M511 420h38M530 401v38" stroke="#1473E6" stroke-width="2"/>
  <text x="530" y="456" class="heading center">Internet Gateway</text>
  <text x="530" y="474" class="tiny center">VPC ↔ internet connectivity</text>

  <rect x="730" y="365" width="200" height="125" rx="14" fill="#FFF8E6" stroke="#D97706" stroke-width="2"/>
  <text x="830" y="397" class="heading center">Route table</text>
  <text x="830" y="425" class="body center">0.0.0.0/0 → IGW</text>
  <text x="830" y="451" class="small center">Makes the subnet public</text>

  <polygon points="1000,350 1125,350 1160,385 1160,470 1125,505 1000,505 965,470 965,385" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/>
  <path d="M1062 370l30 12v24c0 25-16 42-30 49-14-7-30-24-30-49v-24z" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="1062" y="475" class="heading center">Security group</text>
  <text x="1062" y="495" class="tiny center">TCP 80 HTTP • TCP 22 temporary</text>

  <rect x="1210" y="345" width="185" height="225" rx="18" fill="#FFF3E6" stroke="#FF9900" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1262" y="365" width="80" height="52" rx="8" fill="#FF9900"/>
  <text x="1302" y="398" font-family="Arial" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">EC2</text>
  <text x="1302" y="442" class="heading center">Amazon EC2</text>
  <text x="1302" y="465" class="body center">Amazon Linux 2023</text>
  <text x="1302" y="486" class="body center">t2.micro</text>
  <line x1="1232" y1="500" x2="1372" y2="500" stroke="#D97706"/>
  <text x="1302" y="524" class="body center" font-weight="700">Apache HTTP Server</text>
  <text x="1302" y="545" class="tiny center">/var/www/html/index.html</text>
  <text x="1302" y="564" class="body center green" font-weight="700">Hello World</text>

  <ellipse cx="1302" cy="603" rx="86" ry="20" fill="#EEE8FA" stroke="#7B4AB5" stroke-width="2"/>
  <rect x="1216" y="603" width="172" height="58" fill="#EEE8FA" stroke="#7B4AB5" stroke-width="2"/>
  <ellipse cx="1302" cy="661" rx="86" ry="20" fill="#DDD0F2" stroke="#7B4AB5" stroke-width="2"/>
  <text x="1302" y="624" class="heading center">Amazon EBS</text>
  <text x="1302" y="646" class="body center">8 GiB root volume</text>

  <rect x="455" y="550" width="215" height="95" rx="14" fill="#FFFFFF" stroke="#7B4AB5" stroke-width="2"/>
  <text x="562" y="582" class="heading center">Administrator</text>
  <text x="562" y="606" class="body center">EC2 Instance Connect</text>
  <text x="562" y="627" class="small center">Temporary SSH access</text>

  <path d="M270 417H420" fill="none" stroke="#1473E6" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="345" y="397" class="body center blue" font-weight="700">HTTP • TCP 80</text>
  <path d="M640 430H730" fill="none" stroke="#1473E6" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M930 430H965" fill="none" stroke="#1473E6" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <path d="M1160 430H1210" fill="none" stroke="#1473E6" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1185" y="412" class="tiny center blue">Allowed</text>
  <path d="M670 595H965V520H1210" fill="none" stroke="#7B4AB5" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <text x="890" y="577" class="body center purple">Temporary SSH • TCP 22</text>
  <path d="M1302 570V583" stroke="#7B4AB5" stroke-width="3"/>

  <rect x="420" y="704" width="1010" height="42" rx="10" fill="#EAF7ED" stroke="#2E8540"/>
  <text x="440" y="730" class="body"><tspan font-weight="700">Architecture lesson:</tspan> A public IP alone is not enough—traffic also needs an Internet Gateway, a route, and an allowed security-group port.</text>

  <line x1="58" y1="805" x2="105" y2="805" stroke="#1473E6" stroke-width="5"/>
  <text x="120" y="810" class="body">HTTP request/response</text>
  <line x1="315" y1="805" x2="362" y2="805" stroke="#7B4AB5" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="377" y="810" class="body">Administrative SSH</text>
  <text x="1545" y="865" class="small" text-anchor="end">Workshop evidence diagram • No production-grade HA components included</text>
</svg>
